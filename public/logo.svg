<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Circle -->
  <circle cx="100" cy="100" r="55" />
  
  <!-- Upper-left to lower-right diagonal (X left arm) -->
  <line x1="55" y1="35" x2="145" y2="165" />
  
  <!-- Upper-right to lower-left diagonal (X right arm) -->
  <line x1="145" y1="35" x2="55" y2="165" />
  
  <!-- Upward pointing A - left leg -->
  <line x1="65" y1="155" x2="100" y2="40" />
  
  <!-- Upward pointing A - right leg -->
  <line x1="135" y1="155" x2="100" y2="40" />
  
  <!-- Upward A crossbar -->
  <line x1="78" y1="110" x2="122" y2="110" />
  
  <!-- Downward pointing A (inverted) - left leg -->
  <line x1="65" y1="45" x2="100" y2="160" />
  
  <!-- Downward pointing A (inverted) - right leg -->
  <line x1="135" y1="45" x2="100" y2="160" />
  
  <!-- Inverted A crossbar -->
  <line x1="78" y1="90" x2="122" y2="90" />
</svg>
